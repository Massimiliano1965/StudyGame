name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dedica:
        description: "Nome per la dedica «Ideata per …» (vuoto = versione per tutti)"
        required: false
        default: ""
      pin:
        description: "PIN genitori a 4 cifre già deciso (vuoto = lo sceglie il genitore al primo avvio)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # a ogni modifica su main: versione per tutti + versione di Pietro; a mano: solo il nome indicato
        dedica: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.dedica) || '["", "Pietro"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Dedica personale (solo se indicata)
        env:
          DEDICA: ${{ matrix.dedica }}
          PIN: ${{ inputs.pin }}
        run: |
          node -e '
            const fs = require("fs"), d = process.env.DEDICA || "";
            // stessa impronta di hashPin() in app.js
            let pre = "";
            if (/^[0-9]{4}$/.test(process.env.PIN || "")) {
              let h = 5381; for (const ch of "gei|" + process.env.PIN + "|2026") h = ((h << 5) + h + ch.charCodeAt(0)) | 0;
              pre = "p1" + (h >>> 0).toString(36);
            }
            fs.writeFileSync("www/js/dedica.js", "const DEDICA = " + JSON.stringify(d) + ";\nconst PIN_PRESET = " + JSON.stringify(pre) + ";\n");
            if (d) {
              // app separata: altro identificativo e nome, così sta sul telefono accanto a quella per tutti
              const slug = d.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "") || "dedica";
              const esc = d.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
              let x = fs.readFileSync("config.xml", "utf8");
              x = x.replace("id=\"it.massi.studygame\"", "id=\"it.massi.studygame." + slug + "\"");
              x = x.replace("<name>Gioca e Impara</name>", "<name>Gioca e Impara (" + esc + ")</name>");
              fs.writeFileSync("config.xml", x);
            }
          '

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Installa Cordova
        run: npm install -g cordova@12

      - name: Aggiungi piattaforma Android
        run: cordova platform add android@13.0.0

      - name: Aggiungi plugin voce, microfono, fotocamera e blocco
        run: cordova plugin add cordova-plugin-tts-advanced@0.5.3 cordova-plugin-camera@7.0.0 ./plugins-local/speechrecognition ./plugins-local/studylock

      - name: Numero di versione che cresce a ogni build
        run: sed -i "s/<widget /<widget android-versionCode=\"$((100000 + ${{ github.run_number }}))\" /" config.xml

      - name: Configura la firma fissa (stessa chiave a ogni build)
        run: |
          cat > build.json <<EOF
          {"android": {"debug": {"keystore": "$GITHUB_WORKSPACE/signing/studygame.keystore", "storePassword": "studygame", "alias": "studygame", "password": "studygame", "keystoreType": "pkcs12"}}}
          EOF

      - name: Build APK
        run: cordova build android --debug --buildConfig=build.json

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dedica != '' && format('StudyGame-apk-{0}', matrix.dedica) || 'StudyGame-apk' }}
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
