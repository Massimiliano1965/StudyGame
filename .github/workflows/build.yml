name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Installa Cordova
        run: npm install -g cordova@12

      - name: Aggiungi piattaforma Android
        run: cordova platform add android@13.0.0

      - name: Aggiungi plugin voce e microfono
        run: cordova plugin add cordova-plugin-tts-advanced@0.5.3 ./plugins-local/speechrecognition

      - name: Build APK
        run: cordova build android --debug

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyGame-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
