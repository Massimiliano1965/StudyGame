name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dedica:
        description: "Nome per la dedica «Ideata per …» (vuoto = versione per tutti)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Installa Cordova
        run: npm install -g cordova@12

      - name: Aggiungi piattaforma Android
        run: cordova platform add android@13.0.0

      - name: Aggiungi plugin voce, microfono, fotocamera e blocco
        run: cordova plugin add cordova-plugin-tts-advanced@0.5.3 cordova-plugin-camera@7.0.0 ./plugins-local/speechrecognition ./plugins-local/studylock

      - name: Dedica personale (solo se indicata)
        env:
          DEDICA: ${{ inputs.dedica }}
        run: node -e 'require("fs").writeFileSync("www/js/dedica.js", "const DEDICA = " + JSON.stringify(process.env.DEDICA || "") + ";\n")'

      - name: Numero di versione che cresce a ogni build
        run: sed -i "s/<widget /<widget android-versionCode=\"$((100000 + ${{ github.run_number }}))\" /" config.xml

      - name: Configura la firma fissa (stessa chiave a ogni build)
        run: |
          cat > build.json <<EOF
          {"android": {"debug": {"keystore": "$GITHUB_WORKSPACE/signing/studygame.keystore", "storePassword": "studygame", "alias": "studygame", "password": "studygame", "keystoreType": "pkcs12"}}}
          EOF

      - name: Build APK
        run: cordova build android --debug --buildConfig=build.json

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dedica != '' && 'StudyGame-apk-dedica' || 'StudyGame-apk' }}
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
