name: Versione web + Privacy (GitHub Pages)

# Pubblica la versione web (iPhone, PC, Android) e la Privacy su GitHub Pages: indirizzo https://massimiliano1965.github.io/StudyGame/
# Prima volta: Settings > Pages > Source = "GitHub Actions". Poi parte da sola quando cambia privacy.html.
on:
  push:
    branches: [main]
    paths: ['www/**', 'web/**', '.github/workflows/pagina-privacy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepara la versione web (senza Cordova, con avviso blocco schermo)
        run: |
          cp -r www site
          cp web/webnote.js site/js/webnote.js
          sed -i '/src="cordova.js"/d' site/index.html
          sed -i 's|  <script src="js/config.js"></script>|  <script src="js/webnote.js"></script>\n  <script src="js/config.js"></script>|' site/index.html
          grep -q webnote.js site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
