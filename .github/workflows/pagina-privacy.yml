name: Pagina Privacy (GitHub Pages)

# Pubblica www/privacy.html su una pagina web pubblica: serve l'indirizzo per il Play Store.
# Prima volta: Settings > Pages > Source = "GitHub Actions". Poi parte da sola quando cambia privacy.html.
on:
  push:
    branches: [main]
    paths: ['www/privacy.html', '.github/workflows/pagina-privacy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir site && cp www/privacy.html site/index.html && cp www/privacy.html site/privacy.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
