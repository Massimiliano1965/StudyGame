name: Build AAB (Play Store)

# Si avvia a mano (Actions → Build AAB → Run workflow) oppure aggiornando il ramo "aab" (git push origin main:aab).
# Produce il file .aab da caricare su Google Play Console. La build normale (APK per il telefono) non cambia.
on:
  workflow_dispatch:
  push:
    branches: [aab]

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Installa Cordova
        run: npm install -g cordova@12

      # cordova-android 14 punta ad Android 15 (API 35), richiesto da Google Play per le nuove app
      - name: Aggiungi piattaforma Android
        run: cordova platform add android@14.0.1

      - name: Aggiungi plugin
        run: cordova plugin add cordova-plugin-tts-advanced@0.5.3 cordova-plugin-camera@7.0.0 ./plugins-local/speechrecognition ./plugins-local/studylock

      - name: Numero di versione che cresce a ogni build
        run: sed -i "s/<widget /<widget android-versionCode=\"$((100000 + ${{ github.run_number }}))\" /" config.xml

      # Chiave di CARICAMENTO (upload key). Con «Play App Signing» la chiave vera la custodisce Google:
      # se questa si perdesse o fosse compromessa, Google la sostituisce. Per usarne una privata basta creare
      # i segreti UPLOAD_KEYSTORE_B64, UPLOAD_STORE_PASSWORD (e UPLOAD_KEY_ALIAS) nelle impostazioni del repo.
      - name: Configura la firma
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          KS="$GITHUB_WORKSPACE/signing/upload.keystore"; PASS="9mO4c8LoM61UspjBDJsZYvKY"; ALIAS="upload"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"; KS="$RUNNER_TEMP/upload.keystore"; PASS="$KS_PASS"; ALIAS="${KS_ALIAS:-upload}"
            echo "Uso la chiave privata dei segreti del repo"
          else
            echo "Uso la chiave di caricamento del repo (va bene con Play App Signing)"
          fi
          cat > build.json <<JSON
          {"android": {"release": {"keystore": "$KS", "storePassword": "$PASS", "alias": "$ALIAS", "password": "$PASS", "keystoreType": "pkcs12"}}}
          JSON

      - name: Build AAB
        run: cordova build android --release --buildConfig=build.json -- --packageType=bundle

      - name: Carica AAB
        uses: actions/upload-artifact@v4
        with:
          name: GiocaEImpara-aab
          path: platforms/android/app/build/outputs/bundle/release/*.aab
